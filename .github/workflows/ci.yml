# Gate de verificación del sitio público. Corre en CADA PR, sea cual sea su base.
#
# Antes filtraba a `dev` y `main`, y eso dejaba sin gate justo las PR apiladas:
# una rama sacada de otra rama de trabajo, que es lo normal cuando dos cambios
# tocan el mismo fichero y el primero todavía no ha entrado. La PR 47 salió de
# la 46 y se quedó sin verificar hasta que se disparó a mano.
#
# `edited` está en los tipos porque cambiar la base de una PR no dispara
# `synchronize`: sin él, reapuntar una PR apilada a `dev` la dejaba otra vez sin
# gate, que es exactamente lo que pasó.
#
# Sin build de producción: Vercel ya construye un preview por PR y ese es el
# sitio donde un fallo de build se ve, con su URL para mirarlo.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
